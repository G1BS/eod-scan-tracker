<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0A0C10">
<title>Scan Log</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --void:#0A0C10;
    --panel:#12151B;
    --panel-raised:#181C24;
    --hairline:#232833;
    --text:#E8EAED;
    --dim:#7C8494;
    --gain:#1FCE7A;
    --loss:#F0455C;
    --gold:#E8B330;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--void); color:var(--text);
    font-family:'Inter',system-ui,sans-serif; height:100%; overscroll-behavior-y:none;}
  .mono{font-family:'JetBrains Mono',monospace;}

  #app{max-width:520px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;}

  /* ---- Auth screen ---- */
  #auth{display:flex; flex-direction:column; justify-content:center; align-items:center;
    height:100vh; padding:32px; gap:18px; text-align:center;}
  #auth .brand{font-family:'JetBrains Mono',monospace; font-size:13px; letter-spacing:3px;
    color:var(--gold); text-transform:uppercase;}
  #auth h1{font-size:22px; margin:0; font-weight:600;}
  #auth p{color:var(--dim); font-size:14px; margin:0; max-width:280px;}
  #auth input{width:100%; max-width:280px; padding:14px 16px; border-radius:10px; border:1px solid var(--hairline);
    background:var(--panel); color:var(--text); font-size:15px; font-family:'Inter',sans-serif;}
  #auth button{width:100%; max-width:280px; padding:14px; border-radius:10px; border:none;
    background:var(--gold); color:#0A0C10; font-weight:700; font-size:15px;}
  #auth .msg{font-size:13px; color:var(--gain);}

  /* ---- Header ---- */
  header{position:sticky; top:0; z-index:10; background:var(--void); border-bottom:1px solid var(--hairline);
    padding:14px 16px 0 16px;}
  header .row1{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px;}
  header .date{font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--dim); letter-spacing:0.5px;}
  header .title{font-size:17px; font-weight:700;}
  #datepick{background:transparent; border:none; color:var(--dim); font-family:'JetBrains Mono',monospace;
    font-size:13px;}

  #tabs{display:flex; gap:6px; overflow-x:auto; padding-bottom:12px; scrollbar-width:none;}
  #tabs::-webkit-scrollbar{display:none;}
  .tab{flex:0 0 auto; padding:7px 14px; border-radius:999px; font-size:13px; font-weight:600;
    background:var(--panel); color:var(--dim); border:1px solid var(--hairline); white-space:nowrap;}
  .tab.active{background:var(--gold); color:#0A0C10; border-color:var(--gold);}
  .tab .count{opacity:0.65; font-weight:500; margin-left:4px;}

  /* ---- List ---- */
  #list{flex:1; padding:14px 16px 90px 16px; overflow-y:auto;}
  .empty{text-align:center; color:var(--dim); margin-top:60px; font-size:14px; line-height:1.6;}
  .empty .big{font-size:32px; display:block; margin-bottom:10px; opacity:0.5;}

  .card{background:var(--panel); border:1px solid var(--hairline); border-radius:12px;
    padding:14px 14px 12px 14px; margin-bottom:10px; transition:background 0.15s;}
  .card.taken{opacity:0.55;}
  .card .top{display:flex; justify-content:space-between; align-items:center;}
  .ticker{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:16px; letter-spacing:0.3px;}
  .ticker.taken-strike{text-decoration:line-through; color:var(--dim);}
  .score{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:15px;}
  .score.hi{color:var(--gain);} .score.mid{color:var(--gold);} .score.lo{color:var(--loss);}

  .bar{height:5px; border-radius:3px; background:#20242E; margin:9px 0 10px 0; overflow:hidden; position:relative;}
  .bar .fill{height:100%; border-radius:3px;}

  .meta-row{display:flex; justify-content:space-between; font-family:'JetBrains Mono',monospace;
    font-size:12.5px; color:var(--dim); margin-bottom:2px;}
  .meta-row b{color:var(--text); font-weight:600;}
  .stage{font-size:12px; color:var(--dim); margin-top:6px; font-style:italic;}

  .card-actions{display:flex; gap:8px; margin-top:10px; align-items:center;}
  .taken-toggle{font-family:'JetBrains Mono',monospace; font-size:12px; padding:6px 10px; border-radius:6px;
    border:1px solid var(--hairline); background:var(--panel-raised); color:var(--dim);}
  .taken-toggle.on{color:var(--gain); border-color:var(--gain);}
  .notes-btn{font-size:12px; color:var(--dim); border:1px solid var(--hairline); background:var(--panel-raised);
    padding:6px 10px; border-radius:6px;}
  .notes-area{width:100%; margin-top:10px; background:var(--panel-raised); border:1px solid var(--hairline);
    border-radius:8px; color:var(--text); font-family:'Inter',sans-serif; font-size:13.5px; padding:10px;
    resize:none; display:none;}
  .notes-area.show{display:block;}

  #refresh{position:fixed; bottom:20px; right:20px; width:52px; height:52px; border-radius:50%;
    background:var(--gold); border:none; font-size:20px; box-shadow:0 4px 14px rgba(0,0,0,0.4);}
  #signout{position:fixed; top:14px; right:16px; font-size:11px; color:var(--dim); background:none; border:none;
    font-family:'JetBrains Mono',monospace;}

  /* ---- View switch (Scans / Watchlist) ---- */
  #view-switch{display:flex; gap:6px; margin-bottom:12px;}
  #view-switch button{flex:1; padding:9px; border-radius:8px; font-size:13px; font-weight:700;
    background:var(--panel); color:var(--dim); border:1px solid var(--hairline); font-family:'Inter',sans-serif;}
  #view-switch button.active{background:var(--text); color:#0A0C10; border-color:var(--text);}

  /* ---- Watchlist ---- */
  .badge{font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700; padding:3px 8px;
    border-radius:5px; letter-spacing:0.3px; white-space:nowrap;}
  .badge.as-expected, .badge.target-hit{background:rgba(31,206,122,0.14); color:var(--gain);}
  .badge.against-expectation{background:rgba(240,69,92,0.14); color:var(--loss);}
  .badge.reversed{background:rgba(232,179,48,0.14); color:var(--gold);}
  .badge.flat{background:rgba(124,132,148,0.14); color:var(--dim);}

  .wl-card .top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .wl-card .dir{font-size:11px; color:var(--dim); margin-left:6px;}
  .wl-meta{display:flex; gap:14px; font-family:'JetBrains Mono',monospace; font-size:12.5px;
    color:var(--dim); margin-top:8px;}
  .wl-meta b{color:var(--text);}
  .wl-reason{font-size:12px; color:var(--dim); margin-top:6px; font-style:italic;}
  .wl-actions{display:flex; gap:8px; margin-top:10px;}
  .wl-actions button{font-size:12px; padding:6px 10px; border-radius:6px; border:1px solid var(--hairline);
    background:var(--panel-raised); color:var(--dim); font-family:'JetBrains Mono',monospace;}

  #fab-add{position:fixed; bottom:20px; right:20px; width:52px; height:52px; border-radius:50%;
    background:var(--gold); border:none; font-size:26px; box-shadow:0 4px 14px rgba(0,0,0,0.4); color:#0A0C10;}

  #add-form-overlay{position:fixed; inset:0; background:rgba(0,0,0,0.6); display:none; align-items:flex-end;
    z-index:50;}
  #add-form-overlay.show{display:flex;}
  #add-form{background:var(--panel); border-top:1px solid var(--hairline); border-radius:16px 16px 0 0;
    padding:20px 18px 26px 18px; width:100%; max-width:520px; margin:0 auto;}
  #add-form h3{margin:0 0 14px 0; font-size:16px;}
  #add-form label{font-size:12px; color:var(--dim); display:block; margin:10px 0 5px 0;}
  #add-form input, #add-form textarea{width:100%; padding:11px 12px; border-radius:8px; border:1px solid var(--hairline);
    background:var(--panel-raised); color:var(--text); font-size:14px; font-family:'Inter',sans-serif;}
  #add-form textarea{resize:none; height:56px;}
  .dir-toggle{display:flex; gap:8px; margin-top:5px;}
  .dir-toggle button{flex:1; padding:9px; border-radius:8px; border:1px solid var(--hairline);
    background:var(--panel-raised); color:var(--dim); font-size:13px; font-weight:600;}
  .dir-toggle button.selected.bullish{background:rgba(31,206,122,0.14); color:var(--gain); border-color:var(--gain);}
  .dir-toggle button.selected.bearish{background:rgba(240,69,92,0.14); color:var(--loss); border-color:var(--loss);}
  #add-form .form-row{display:flex; gap:10px;}
  #add-form .form-row > div{flex:1;}
  #add-form .submit-row{display:flex; gap:10px; margin-top:16px;}
  #add-form .submit-row button{flex:1; padding:13px; border-radius:9px; font-size:14px; font-weight:700; border:none;}
  #cancel-add{background:var(--panel-raised); color:var(--dim);}
  #save-add{background:var(--gold); color:#0A0C10;}
</style>
</head>
<body>
<div id="app">

  <div id="auth" style="display:none;">
    <div class="brand">Scan&nbsp;Log</div>
    <h1>Private EOD tracker</h1>
    <p>Sign in with a magic link — only your email can ever access this.</p>
    <input id="email-input" type="email" placeholder="you@example.com" autocomplete="email">
    <button id="send-link">Send magic link</button>
    <div class="msg" id="auth-msg"></div>
  </div>

  <div id="main" style="display:none;">
    <button id="signout">SIGN OUT</button>
    <header>
      <div class="row1">
        <div class="title">Scan Log</div>
        <input type="date" id="datepick" class="mono">
      </div>
      <div id="view-switch">
        <button id="view-scans" class="active">SCANS</button>
        <button id="view-watchlist">WATCHLIST</button>
      </div>
      <div id="tabs"></div>
    </header>
    <div id="list"></div>
    <div id="watchlist-list" style="display:none; padding:14px 16px 90px 16px; overflow-y:auto; flex:1;"></div>
    <button id="refresh">⟳</button>
    <button id="fab-add" style="display:none;">+</button>
  </div>

  <div id="add-form-overlay">
    <div id="add-form">
      <h3>Add to watchlist</h3>
      <label>Ticker</label>
      <input id="wl-ticker" type="text" placeholder="e.g. RELIANCE" autocapitalize="characters">
      <div class="form-row">
        <div>
          <label>Entry price</label>
          <input id="wl-entry" type="number" step="0.05" placeholder="2950">
        </div>
        <div>
          <label>Target (optional)</label>
          <input id="wl-target" type="number" step="0.05" placeholder="3150">
        </div>
      </div>
      <label>Direction</label>
      <div class="dir-toggle">
        <button id="dir-bullish" class="selected bullish" data-dir="bullish">▲ Bullish</button>
        <button id="dir-bearish" class="bearish" data-dir="bearish">▼ Bearish</button>
      </div>
      <label>Reason / notes (optional)</label>
      <textarea id="wl-reason" placeholder="Why did you shortlist this?"></textarea>
      <div class="submit-row">
        <button id="cancel-add">Cancel</button>
        <button id="save-add">Save</button>
      </div>
    </div>
  </div>

</div>

<script>
// ============================================================
// CONFIG — fill these in from your Supabase project settings
// (Project Settings -> API). The anon key is safe to expose here;
// Row Level Security locks reads/writes to signed-in users only.
// ============================================================
const SUPABASE_URL = "https://vnvtcqadhhpywlvysjqu.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_S51-uhmaZLjN3ELgChOX9A_gY5Jn2Vt";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentDate = new Date().toISOString().slice(0,10);
let currentStrategy = null;
let rowsCache = [];

const $ = (id) => document.getElementById(id);

// ---------- Auth ----------
async function checkSession(){
  const { data:{ session } } = await sb.auth.getSession();
  if (session) { showMain(); } else { $("auth").style.display="flex"; }
}

$("send-link").onclick = async () => {
  const email = $("email-input").value.trim();
  if (!email) return;
  const { error } = await sb.auth.signInWithOtp({ email, options:{ emailRedirectTo: window.location.href }});
  $("auth-msg").textContent = error ? "Error sending link." : "Check your email for the link.";
};

$("signout").onclick = async () => { await sb.auth.signOut(); location.reload(); };

sb.auth.onAuthStateChange((event, session) => { if (session) showMain(); });

function showMain(){
  $("auth").style.display="none";
  $("main").style.display="block";
  $("datepick").value = currentDate;
  loadStrategies();
}

// ---------- Data loading ----------
async function loadStrategies(){
  const { data, error } = await sb.from("scan_results").select("strategy").eq("scan_date", currentDate);
  if (error) { console.error(error); return; }
  const counts = {};
  data.forEach(r => counts[r.strategy] = (counts[r.strategy]||0) + 1);
  const strategies = Object.keys(counts).sort();
  renderTabs(strategies, counts);
  currentStrategy = strategies.includes(currentStrategy) ? currentStrategy : (strategies[0] || null);
  loadRows();
}

function renderTabs(strategies, counts){
  const tabsEl = $("tabs");
  if (strategies.length === 0){
    tabsEl.innerHTML = "";
    return;
  }
  tabsEl.innerHTML = strategies.map(s => `
    <button class="tab ${s===currentStrategy?'active':''}" data-s="${s}">
      ${s}<span class="count">${counts[s]}</span>
    </button>`).join("");
  tabsEl.querySelectorAll(".tab").forEach(btn => {
    btn.onclick = () => { currentStrategy = btn.dataset.s; renderTabs(strategies, counts); loadRows(); };
  });
}

async function loadRows(){
  const listEl = $("list");
  if (!currentStrategy){
    listEl.innerHTML = `<div class="empty"><span class="big">—</span>No scans logged for this date yet.</div>`;
    return;
  }
  const { data, error } = await sb.from("scan_results").select("*")
    .eq("scan_date", currentDate).eq("strategy", currentStrategy)
    .order("score", { ascending:false, nullsFirst:false });
  if (error){ console.error(error); return; }
  rowsCache = data;
  renderList(data);
}

function scoreBand(score){
  if (score===null || score===undefined) return "mid";
  if (score>=75) return "hi";
  if (score>=50) return "mid";
  return "lo";
}
function scoreColor(band){ return band==="hi" ? "var(--gain)" : band==="mid" ? "var(--gold)" : "var(--loss)"; }

function renderList(rows){
  const listEl = $("list");
  if (rows.length===0){
    listEl.innerHTML = `<div class="empty"><span class="big">—</span>No shortlisted tickers for this strategy today.</div>`;
    return;
  }
  listEl.innerHTML = rows.map(r => {
    const band = scoreBand(r.score);
    const pct = r.score!=null ? Math.max(4, Math.min(100, r.score)) : 0;
    return `
    <div class="card ${r.taken?'taken':''}" data-id="${r.id}">
      <div class="top">
        <span class="ticker ${r.taken?'taken-strike':''}">${r.ticker}</span>
        <span class="score ${band}">${r.score!=null ? r.score : '—'}</span>
      </div>
      <div class="bar"><div class="fill" style="width:${pct}%; background:${scoreColor(band)};"></div></div>
      <div class="meta-row"><span>ENTRY <b>${r.entry ?? '—'}</b></span><span>STOP <b>${r.stop ?? '—'}</b></span><span>TARGET <b>${r.target ?? '—'}</b></span></div>
      ${r.stage ? `<div class="stage">${r.stage}</div>` : ""}
      <div class="card-actions">
        <button class="taken-toggle ${r.taken?'on':''}" data-action="taken">${r.taken ? '[x] taken' : '[ ] taken'}</button>
        <button class="notes-btn" data-action="notes">notes</button>
      </div>
      <textarea class="notes-area" placeholder="Add a note...">${r.notes ?? ''}</textarea>
    </div>`;
  }).join("");

  listEl.querySelectorAll(".card").forEach(card => {
    const id = card.dataset.id;
    card.querySelector('[data-action="taken"]').onclick = async (e) => {
      const row = rowsCache.find(r=>r.id===id);
      const newVal = !row.taken;
      e.target.textContent = newVal ? '[x] taken' : '[ ] taken';
      e.target.classList.toggle('on', newVal);
      card.classList.toggle('taken', newVal);
      card.querySelector('.ticker').classList.toggle('taken-strike', newVal);
      row.taken = newVal;
      await sb.from("scan_results").update({ taken:newVal }).eq("id", id);
    };
    const notesArea = card.querySelector(".notes-area");
    card.querySelector('[data-action="notes"]').onclick = () => notesArea.classList.toggle("show");
    let saveTimer;
    notesArea.oninput = () => {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(async () => {
        await sb.from("scan_results").update({ notes: notesArea.value }).eq("id", id);
      }, 600);
    };
  });
}

$("datepick").onchange = (e) => { currentDate = e.target.value; loadStrategies(); };
$("refresh").onclick = () => { currentView==="scans" ? loadStrategies() : loadWatchlist(); };

// ---------- View switching (Scans / Watchlist) ----------
let currentView = "scans";

function setView(view){
  currentView = view;
  $("view-scans").classList.toggle("active", view==="scans");
  $("view-watchlist").classList.toggle("active", view==="watchlist");
  $("tabs").style.display = view==="scans" ? "flex" : "none";
  $("datepick").style.display = view==="scans" ? "block" : "none";
  $("list").style.display = view==="scans" ? "block" : "none";
  $("watchlist-list").style.display = view==="watchlist" ? "block" : "none";
  $("fab-add").style.display = view==="watchlist" ? "block" : "none";
  if (view==="watchlist") loadWatchlist(); else loadStrategies();
}
$("view-scans").onclick = () => setView("scans");
$("view-watchlist").onclick = () => setView("watchlist");

// ---------- Watchlist: load + render ----------
async function loadWatchlist(){
  const el = $("watchlist-list");
  const { data, error } = await sb.from("watchlist_items").select("*")
    .eq("status", "active").order("added_at", { ascending:false });
  if (error){ console.error(error); el.innerHTML = `<div class="empty">Couldn't load watchlist.</div>`; return; }
  if (data.length===0){
    el.innerHTML = `<div class="empty"><span class="big">—</span>Nothing on your watchlist yet.<br>Tap + to add a stock.</div>`;
    return;
  }
  el.innerHTML = data.map(renderWatchlistCard).join("");
  el.querySelectorAll(".wl-close").forEach(btn => {
    btn.onclick = async () => {
      await sb.from("watchlist_items").update({ status:"closed" }).eq("id", btn.dataset.id);
      loadWatchlist();
    };
  });
}

function badgeClass(status){
  return {
    "As Expected":"as-expected", "Target Hit":"target-hit",
    "Against Expectation":"against-expectation", "Reversed":"reversed", "Flat":"flat"
  }[status] || "flat";
}

function renderWatchlistCard(item){
  const addedDate = new Date(item.added_at).toLocaleDateString("en-IN", { day:"numeric", month:"short" });
  const pct = item.pct_change;
  const pctStr = pct!=null ? `${pct>0?'+':''}${pct.toFixed(2)}%` : "—";
  const status = item.computed_status || "Flat";
  return `
    <div class="card wl-card">
      <div class="top">
        <div><span class="ticker">${item.ticker}</span><span class="dir">${item.direction==='bullish'?'▲':'▼'} ${item.direction}</span></div>
        <span class="badge ${badgeClass(status)}">${status.toUpperCase()}</span>
      </div>
      <div class="wl-meta">
        <span>ENTRY <b>${item.entry_price}</b> · ${addedDate}</span>
        <span>NOW <b>${item.latest_price ?? '—'}</b></span>
        <span>${pctStr}</span>
      </div>
      ${item.target ? `<div class="wl-meta"><span>TARGET <b>${item.target}</b></span></div>` : ""}
      ${item.reason ? `<div class="wl-reason">${item.reason}</div>` : ""}
      <div class="wl-actions">
        <button class="wl-close" data-id="${item.id}">Archive</button>
      </div>
    </div>`;
}

// ---------- Add-stock form ----------
let selectedDir = "bullish";
$("fab-add").onclick = () => $("add-form-overlay").classList.add("show");
$("cancel-add").onclick = () => $("add-form-overlay").classList.remove("show");
$("dir-bullish").onclick = () => { selectedDir="bullish"; $("dir-bullish").classList.add("selected"); $("dir-bearish").classList.remove("selected"); };
$("dir-bearish").onclick = () => { selectedDir="bearish"; $("dir-bearish").classList.add("selected"); $("dir-bullish").classList.remove("selected"); };

$("save-add").onclick = async () => {
  const ticker = $("wl-ticker").value.trim().toUpperCase();
  const entry = parseFloat($("wl-entry").value);
  const target = $("wl-target").value ? parseFloat($("wl-target").value) : null;
  const reason = $("wl-reason").value.trim();
  if (!ticker || !entry){ alert("Ticker and entry price are required."); return; }

  const { error } = await sb.from("watchlist_items").insert({
    ticker, entry_price: entry, direction: selectedDir, target, reason,
    latest_price: entry, latest_price_date: new Date().toISOString().slice(0,10),
    pct_change: 0, peak_favorable_pct: 0, computed_status: "Flat"
  });
  if (error){ alert("Couldn't save: " + error.message); return; }

  $("wl-ticker").value=""; $("wl-entry").value=""; $("wl-target").value=""; $("wl-reason").value="";
  selectedDir="bullish"; $("dir-bullish").classList.add("selected"); $("dir-bearish").classList.remove("selected");
  $("add-form-overlay").classList.remove("show");
  loadWatchlist();
};


checkSession();

if ("serviceWorker" in navigator){
  window.addEventListener("load", () => navigator.serviceWorker.register("service-worker.js"));
}
</script>
</body>
</html>
